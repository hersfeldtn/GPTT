//	=======================================
//	*** Now patch Configure modules on parts ***
//	=======================================

// This section updates the Configure modules to match upgrade placement
@PART[*]:HAS[@MODULE[Configure]]:NEEDS[KerbalismConfig,FeatureScience]:LAST[KerbalismConfig]
{
	// Unmanned experiments
	@MODULE[Configure]:HAS[#title[Unmanned?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Unmanned-Upgrade1]]
			{
				@techRequired__ = gptt_probe2
			}
		}
		@SETUP[Double-C?Seismic?Accelerometer] { @tech = gptt_geo1 }
		@SETUP[Geiger?Counter] { gptt_scienceEnv }
		@SETUP[2HOT?Thermometer] { @tech = gptt_scienceInst }
		@SETUP[Telemetry?Report] { @tech = start }
		@SETUP[LITE] { @tech = gptt_scienceEnv }
		@SETUP[MITE] { @tech = gptt_mag1 }
		@SETUP[SITE] { @tech = gptt_geo3 }
	}
	
	// Orbital experiments
	@MODULE[Configure]:HAS[#title[Orbital?Scanner]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Orbital-Upgrade1]]
			{
				@techRequired__ = gptt_film6
			}
		}
		@SETUP[GRAVMAX?Negative?Gravioli?Detector] { @tech = gptt_scienceGrav }
		@SETUP[BEEP] { @tech = gptt_atmo1 }
		@SETUP[DING] { @tech = gptt_sciRad1 }
		@SETUP[TICK] { @tech = gptt_sciRad2 }
	}
	
	// Lab experiments
	@MODULE[Configure]:HAS[#title[Laboratory?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Lab-Upgrade1]]
			{
				@techRequired__ = gptt_habLab
			}
			@UPGRADE:HAS[#name__[Lab-Upgrade2]]
			{
				@techRequired__ = gptt_lab2
			}
		}
		@SETUP[CHILLED] { @tech = gptt_agri1 }
		@SETUP[RELAX] { @tech = gptt_geo2 }
		@SETUP[JAMMED] { @tech = gptt_lab0 }
		@SETUP[TRAPPED] { @tech = gptt_surfacelab }
		@SETUP[SALINE] { @tech = gptt_geo4 }
		@SETUP[BIRDIE] { @tech = gptt_atmo3 }
		@SETUP[Materials?Bay?Study] { @tech = gptt_scienceMat1 }
		@SETUP[Mystery?Goo?Observation] { @tech = gptt_scienceBio }
	}
	
	// Atmospheric experiments
	@MODULE[Configure]:HAS[#title[Atmospheric?Science]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Atmo-Upgrade1]]
			{
				@techRequired__ = gptt_atmo2
			}
		}
		@SETUP[Atmospheric?Fluid?Spectro-Variometer] { @tech = gptt_atmo3 }
		@SETUP[PresMat?Barometer] { @tech = gptt_scienceInst }
		@SETUP[CURVE] { @tech = gptt_atmo1 }
		@SETUP[WING] { gptt_film1 }
		@SETUP[CLOUD] { @tech = gptt_atmo2 }
	}
	
	// Crew experiments
	@MODULE[Configure]:HAS[#title[Crew?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Crew-Upgrade1]]
			{
				@techRequired__ = gptt_lab0
			}
		}
		@SETUP[FLIGHT] { @tech = gptt_crew2 }
		@SETUP[HERRING] { @tech = gptt_hab2 }
		@SETUP[FLOAT] { @tech = gptt_hab1 }
		@SETUP[LEAVE] { @tech = gptt_hab2 }
		@SETUP[STAKE] { @tech = gptt_surface2 }
		@SETUP[SHAKE] { @tech = gptt_surface3 }
		@SETUP[CLAM] { @tech = gptt_oceanSurface }
		@SETUP[WRECK] { @tech = gptt_geo4 }
	}
	
	// Underwater experiments
	@MODULE[Configure]:HAS[#title[Underwater?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Underwater-Upgrade1]]
			{
				@techRequired__ = gptt_geo4
			}
		}
		@SETUP[SALT] { @tech = gptt_geo4 }
		@SETUP[H2O] { @tech = gptt_geo2 }
	}
}

