{
	@partIcon = kerbalism-chemicalplant
	@techRequired = gptt_agri0
}

//	=======================================
//	*** Now patch Configure modules on parts ***
//	=======================================

// This section updates the Configure modules to match upgrade placement
@PART[*]:HAS[@MODULE[Configure]]:NEEDS[KerbalismConfig,FeatureScience]:LAST[KerbalismConfig]
{
	// Unmanned experiments
	@MODULE[Configure]:HAS[#title[Unmanned?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Unmanned-Upgrade1]]
			{
				@techRequired__ = gptt_probe2
			}
		}
		@SETUP[Double-C?Seismic?Accelerometer] { @tech = gptt_geo1 }
		@SETUP[Geiger?Counter] { @tech = gptt_sciRad1 }
		@SETUP[2HOT?Thermometer] { @tech = gptt_scienceInst }
		@SETUP[Telemetry?Report] { @tech = start }
		@SETUP[LITE] { @tech = gptt_mag1 }
		@SETUP[MITE] { @tech = gptt_scienceEnv }
		@SETUP[SITE] { @tech = gptt_probe1 }
	}
	
	// Orbital experiments
	@MODULE[Configure]:HAS[#title[Orbital?Scanner]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Orbital-Upgrade1]]
			{
				@techRequired__ = gptt_survey1
			}
		}
		@SETUP[GRAVMAX?Negative?Gravioli?Detector] { @tech = gptt_scienceGrav }
		@SETUP[BEEP] { @tech = gptt_radScience1 }
		@SETUP[DING] { @tech = gptt_survey1 }
		@SETUP[TICK] { @tech = gptt_survey2 }
	}
	
	// Lab experiments
	@MODULE[Configure]:HAS[#title[Laboratory?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Lab-Upgrade1]]
			{
				@techRequired__ = gptt_lab0
			}
			@UPGRADE:HAS[#name__[Lab-Upgrade2]]
			{
				@techRequired__ = gptt_habLab
			}
		}
		@SETUP[CHILLED] { @tech = gptt_cryoLife }
		@SETUP[RELAX] { @tech = gptt_lab0 }
		@SETUP[JAMMED] { @tech = gptt_scienceMat1 }
		@SETUP[TRAPPED] { @tech = gptt_sciRad2 }
		@SETUP[SALINE] { @tech = gptt_geo4 }
		@SETUP[BIRDIE] { @tech = gptt_scienceBio }
		@SETUP[Materials?Bay?Study] { @tech = gptt_scienceMat1 }
		@SETUP[Mystery?Goo?Observation] { @tech = gptt_scienceBio }
	}
	
	// Atmospheric experiments
	@MODULE[Configure]:HAS[#title[Atmospheric?Science]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Atmo-Upgrade1]]
			{
				@techRequired__ = gptt_atmo2
			}
		}
		@SETUP[Atmospheric?Fluid?Spectro-Variometer] { @tech = gptt_atmo1 }
		@SETUP[PresMat?Barometer] { @tech = gptt_atmo1 }
		@SETUP[CURVE] { @tech = gptt_atmo2 }
		@SETUP[WING] { @tech = gptt_airframe2 }
		@SETUP[CLOUD] { @tech = gptt_atmo3 }
	}
	
	// Crew experiments
	@MODULE[Configure]:HAS[#title[Crew?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Crew-Upgrade1]]
			{
				@techRequired__ = gptt_surface2
			}
		}
		@SETUP[FLIGHT] { @tech = gptt_crew2 }
		@SETUP[HERRING] { @tech = gptt_lifesupport }
		@SETUP[FLOAT] { @tech = gptt_hab1 }
		@SETUP[LEAVE] { @tech = gptt_eva }
		@SETUP[STAKE] { @tech = gptt_surface1 }
		@SETUP[SHAKE] { @tech = gptt_surface2 }
		@SETUP[CLAM] { @tech = gptt_oceanSurface }
		@SETUP[WRECK] { @tech = gptt_surface3 }
	}
	
	// Underwater experiments
	@MODULE[Configure]:HAS[#title[Underwater?Experiments]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Underwater-Upgrade1]]
			{
				@techRequired__ = gptt_geo4
			}
		}
	}
}

//	=======================================
//	*** Life Support Components ***
//	=======================================

@PART[*]:HAS[#CrewCapacity[>0],!MODULE[KerbalSeat]]:NEEDS[KerbalismConfig]:LAST[KerbalismConfig]
{
	@MODULE[Configure]:HAS[#title[Pod]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Upgrade-Slots]]
			{
				@techRequired__ = gptt_agri0
			}
		}
		@SETUP[Pressure?Control] { @tech = gptt_tank1 }
		@SETUP[Water?Recycler]:NEEDS[ProfileDefault] { @tech = gptt_lifesupport }
		@SETUP[Waste?Processor]:NEEDS[ProfileDefault] { @tech = gptt_agri0 }
		@SETUP[Monoprop?Oxygen?Fuel?Cell]:NEEDS[ProfileDefault] { @tech = gptt_fuelCell }
	}
}

@PART[kerbalism-lifesupportmodule]:NEEDS[KerbalismConfig]:LAST[KerbalismConfig]
{
	@MODULE[Configure]:HAS[#title[Life?Support]]
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Upgrade-Slots]]
			{
				@techRequired__ = gptt_agri0
			}
		}
		@SETUP[Pressure?Control] { @tech = gptt_tank1 }
		@SETUP[Water?Recycler]:NEEDS[ProfileDefault] { @tech = gptt_lifesupport }
		@SETUP[Waste?Processor]:NEEDS[ProfileDefault] { @tech = gptt_agri0 }
		@SETUP[Monoprop?Oxygen?Fuel?Cell]:NEEDS[ProfileDefault] { @tech = gptt_fuelCell }
	}

}
