# Jet Propulsion
@PART[KPGrumble]:NEEDS[KerbalPowerPlants]:AFTER[zzGPTT]
{
	@TechRequired = gptt_jet1
}
# Turbofans
@PART[KPTiger,KPLeopard]:NEEDS[KerbalPowerPlants]:AFTER[zzGPTT]
{
	@TechRequired = gptt_jet2
}
# Ramjets
@PART[KPJolt]:NEEDS[KerbalPowerPlants]:AFTER[zzGPTT]
{
	@TechRequired = gptt_jet3
}
# Thrust Vectoring
@PART[KPPuma,KPJaguar]:NEEDS[KerbalPowerPlants]:AFTER[zzGPTT]
{
	@TechRequired = gptt_jetMan1
}
# VTOL Engines
@PART[KPLion,KPInlineVentilation]:NEEDS[KerbalPowerPlants]:AFTER[zzGPTT]
{
	@TechRequired = gptt_jetMan2
}
@PART[KPZephyr]:NEEDS[KerbalPowerPlants]:AFTER[zzGPTT]
{
	@TechRequired = gptt_prop2
}